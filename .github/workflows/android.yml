name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'public/**', 'scripts/build-*.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'public/**', 'scripts/build-*.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: node scripts/verify.mjs && node scripts/build-android-assets.mjs
      - run: ./gradlew assembleRelease lintRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: bureau-android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
